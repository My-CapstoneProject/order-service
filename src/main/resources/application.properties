spring.application.name=order-service
spring.datasource.url=jdbc:mysql://localhost:3306/order_database
spring.datasource.username=root
spring.datasource.password=pass@word1

server.port=8002
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka/

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection pool settings (optional, depends on your requirements)
spring.datasource.initialization-mode=always

feign.hystrix.enabled=true
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.idle-timeout=30000
#spring.datasource.hikari.connection-timeout=20000
#spring.datasource.hikari.max-lifetime=1800000

# Logging level (optional)
#logging.level.org.hibernate.SQL=DEBUG

#spring.datasource.schema=classpath:schema.sql
#spring.datasource.data=classpath:data.sql

store.service.url=http://localhost:7001
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

logging.level.com.sr.order_service.service.StoreClient=DEBUG